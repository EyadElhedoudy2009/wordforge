<style>
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 38%,#2a0f52 0%,#12081f 55%,#07040d 100%);color:#efe6ff;transition:opacity .55s ease,visibility .55s;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#splash.out{opacity:0;visibility:hidden}
#splash .wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
#splash .logo{position:relative;width:112px;height:112px;border-radius:26px;box-shadow:0 0 0 0 rgba(150,100,255,.6),0 18px 50px rgba(109,59,210,.55);animation:sp-pop .8s cubic-bezier(.2,1.4,.4,1) both,sp-glow 1.8s ease-out .5s both}
#splash .logo img{width:100%;height:100%;border-radius:26px;display:block}
#splash .logo i{position:absolute;right:-10px;top:-10px;width:16px;height:16px;background:#ffd36e;border-radius:50%;filter:blur(.3px);opacity:0;animation:sp-spark 1s ease-out .55s both;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
#splash h1{margin:0;font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:.02em;display:flex}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(-26px) scale(1.25);animation:sp-drop .5s cubic-bezier(.2,1.2,.4,1) both}
#splash h1 span.f{background:linear-gradient(180deg,#fff,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin:-8px 0 0;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#a995d6;opacity:0;animation:sp-fade .6s ease 1.35s both}
#splash .bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:sp-fade .4s ease 1s both}
#splash .bar b{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#6d3bd2,#c4a1ff);transform:translateX(-100%);animation:sp-load 1.2s ease-in-out 1s both}
@keyframes sp-pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-glow{0%{box-shadow:0 0 0 0 rgba(170,120,255,.7),0 18px 50px rgba(109,59,210,.55)}100%{box-shadow:0 0 0 46px rgba(170,120,255,0),0 18px 50px rgba(109,59,210,.55)}}
@keyframes sp-spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(2.2) rotate(90deg)}100%{opacity:.9;transform:scale(1.4) rotate(180deg)}}
@keyframes sp-drop{to{opacity:1;transform:none}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-load{to{transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

<script>
(function () {
  var splash = document.getElementById('splash'), h1 = document.getElementById('splash-name');
  'WordForge'.split('').forEach(function (c, i) {
    var s = document.createElement('span'); s.textContent = c; if (i >= 4) s.className = 'f';
    s.style.animationDelay = (0.55 + i * 0.07) + 's'; h1.appendChild(s);
  });
  var soundOn = true;
  try { var st = JSON.parse(localStorage.getItem('wordforge.v1') || 'null'); if (st && st.settings && st.settings.sound === false) soundOn = false; } catch (e) {}
  var ctx = null, played = false;
  function tone(f, t0, dur, type, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function chime() {
    if (played || !ctx || ctx.state !== 'running') return;
    played = true;
    tone(196, 0.0, 0.5, 'triangle', 0.16);              // low "whoomp" as the logo lands
    tone(130, 0.0, 0.5, 'sine', 0.12);
    [[1568, 0.55], [2093, 0.62], [2637, 0.69], [3136, 0.76]].forEach(function (n) { tone(n[0], n[1], 0.5, 'sine', 0.05); }); // the sparkle
    [523, 659, 784].forEach(function (f, i) { tone(f, 1.3 + i * 0.06, 0.9, 'triangle', 0.07); }); // soft major chord as the tagline appears
  }
  if (soundOn) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        ctx = new AC();
        var go = function () { if (ctx.state === 'suspended') ctx.resume().then(chime, function () {}); else chime(); };
        go();
        // browsers may hold sound until the first tap or key: play it then, if the splash is still up
        ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, function () { if (!played && !splash.classList.contains('out')) go(); }, { once: true, passive: true }); });
      }
    } catch (e) {}
  }
  var born = Date.now(), MIN = 2300;
  function hide() { splash.classList.add('out'); setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); try { ctx && ctx.close(); } catch (e) {} }, 800); }
  window.addEventListener('load', function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - born))); });
  setTimeout(hide, 6000); // never get stuck
})();
