<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordForge · SAT vocab</title>
<meta name="description" content="A daily 15-word SAT vocabulary game with spaced repetition.">
<meta name="theme-color" content="#12081f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordForge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 38%,#2a0f52 0%,#12081f 55%,#07040d 100%);color:#efe6ff;transition:opacity .55s ease,visibility .55s;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#splash.out{opacity:0;visibility:hidden}
#splash .wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
#splash .logo{position:relative;width:112px;height:112px;border-radius:26px;box-shadow:0 0 0 0 rgba(150,100,255,.6),0 18px 50px rgba(109,59,210,.55);animation:sp-pop .8s cubic-bezier(.2,1.4,.4,1) both,sp-glow 1.8s ease-out .5s both}
#splash .logo svg,#splash .logo img{width:100%;height:100%;border-radius:26px;display:block}
#splash .logo i{position:absolute;right:-10px;top:-10px;width:16px;height:16px;background:#ffd36e;border-radius:50%;filter:blur(.3px);opacity:0;animation:sp-spark 1s ease-out .55s both;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
#splash h1{margin:0;font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:.02em;display:flex}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(-26px) scale(1.25);animation:sp-drop .5s cubic-bezier(.2,1.2,.4,1) both}
#splash h1 span.f{background:linear-gradient(180deg,#fff,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin:-8px 0 0;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#a995d6;opacity:0;animation:sp-fade .6s ease 1.35s both}
#splash .bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:sp-fade .4s ease 1s both}
#splash .bar b{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#6d3bd2,#c4a1ff);transform:translateX(-100%);animation:sp-load 1.2s ease-in-out 1s both}
@keyframes sp-pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-glow{0%{box-shadow:0 0 0 0 rgba(170,120,255,.7),0 18px 50px rgba(109,59,210,.55)}100%{box-shadow:0 0 0 46px rgba(170,120,255,0),0 18px 50px rgba(109,59,210,.55)}}
@keyframes sp-spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(2.2) rotate(90deg)}100%{opacity:.9;transform:scale(1.4) rotate(180deg)}}
@keyframes sp-drop{to{opacity:1;transform:none}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-load{to{transform:none}}
#splash:not(.go) .logo,#splash:not(.go) h1 span,#splash:not(.go) p,#splash:not(.go) .bar,#splash:not(.go) .bar b,#splash:not(.go) .logo i{animation-play-state:paused}
#splash .tap{position:absolute;left:0;right:0;bottom:max(48px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#a995d6;opacity:0;pointer-events:none;transition:opacity .4s ease}
#splash.wait .tap{opacity:1;animation:sp-pulse 1.4s ease-in-out infinite}
@keyframes sp-pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="wrap">
  <div class="logo"><svg viewBox="0 0 192 192" width="100%" height="100%" style="display:block;border-radius:26px" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12081f"/><stop offset="1" stop-color="#5a33b8"/></linearGradient></defs><rect width="192" height="192" rx="44" fill="url(#spg)"/><polyline points="48,70 72,142 96,92 120,142 144,70" fill="none" stroke="#eadfff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 30l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#ffd36e"/></svg><i></i></div>
  <h1 id="splash-name"></h1>
  <p>Forge your vocabulary</p>
  <div class="bar"><b></b></div>
</div><div class="tap">Tap to start</div></div>
<script>
(function () {
  var splash = document.getElementById('splash'), h1 = document.getElementById('splash-name');
  'WordForge'.split('').forEach(function (c, i) {
    var s = document.createElement('span'); s.textContent = c; if (i >= 4) s.className = 'f';
    s.style.animationDelay = (0.55 + i * 0.07) + 's'; h1.appendChild(s);
  });
  var soundOn = true;
  try { var st = JSON.parse(localStorage.getItem('wordforge.v1') || 'null'); if (st && st.settings && st.settings.sound === false) soundOn = false; } catch (e) {}
  var ctx = null, played = false, started = false, loaded = false, born = 0, MIN = 2300, hidden = false;
  function tone(f, t0, dur, type, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function chime() {
    if (played || !ctx || ctx.state !== 'running') return;
    played = true;
    tone(196, 0.0, 0.5, 'triangle', 0.16); tone(130, 0.0, 0.5, 'sine', 0.12);
    [[1568, 0.55], [2093, 0.62], [2637, 0.69], [3136, 0.76]].forEach(function (n) { tone(n[0], n[1], 0.5, 'sine', 0.05); });
    [523, 659, 784].forEach(function (f, i) { tone(f, 1.3 + i * 0.06, 0.9, 'triangle', 0.07); });
  }
  function hide() {
    if (hidden) return; hidden = true; splash.classList.add('out');
    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); try { ctx && ctx.close(); } catch (e) {} }, 800);
  }
  function maybeHide() { if (started && loaded) setTimeout(hide, Math.max(0, MIN - (Date.now() - born))); }
  // start the show: animation and sound begin together
  function begin() {
    if (started) return; started = true; born = Date.now();
    splash.classList.remove('wait'); splash.classList.add('go');
    chime(); maybeHide();
  }
  window.addEventListener('load', function () { loaded = true; maybeHide(); });
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!soundOn || !AC) { begin(); return; }
  try { ctx = new AC(); } catch (e) { begin(); return; }
  // Browsers only allow sound after a tap or key press. If sound is already allowed, play straight away;
  // if not, wait for one tap so the animation and the sound start together.
  function tryNow() { if (ctx.state === 'running') begin(); }
  try { ctx.resume && ctx.resume().then(function () { setTimeout(tryNow, 30); }, function () {}); } catch (e) {}
  setTimeout(function () {
    if (started) return;
    if (ctx.state === 'running') { begin(); return; }
    splash.classList.add('wait');
    var go = function () { ctx.resume().then(begin, begin); setTimeout(begin, 400); };
    ['pointerdown', 'keydown', 'touchend', 'click'].forEach(function (ev) { window.addEventListener(ev, go, { once: true, passive: true }); });
    setTimeout(begin, 15000); // never get stuck behind the prompt
  }, 120);
})();
</script>
<div id="app" class="app"></div>
<noscript><p style="padding:24px;color:#fff">WordForge needs JavaScript to run.</p></noscript>
<script src="words.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
